[package]
name = "retifs-photos-jni"
description = "retifs Photos for Android: the photos core to Kotlin, through JNI, as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "retifs_photos"
crate-type = ["cdylib"]

[dependencies]
retifs-photos-core = { path = "../../core" }
jni = { version = "0.21", default-features = false }
serde_json = "1"
libretifs = { path = "../../../retifs/crates/libretifs" }
