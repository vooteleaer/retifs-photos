[package]
name = "retifs-photos-gtk"
description = "retifs Photos for Linux: a GTK 4 / libadwaita front end"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "retifs-photos"
path = "src/main.rs"

[dependencies]
retifs-photos-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
