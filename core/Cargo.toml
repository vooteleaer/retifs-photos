[package]
name = "retifs-photos-core"
description = "Photos on retifs: pictures, their thumbnails, albums and the people in them (ADR-0024, ADR-0026), through libretifs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libretifs = { path = "../../retifs/crates/libretifs" }
# Describing a picture imported here, as the extractor would (ADR-0023, ADR-0026).
retifs-extract = { path = "../../retifs/crates/retifs-extract" }
tokio = { version = "1", features = ["rt"] }
