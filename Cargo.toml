[workspace]
resolver = "2"
members = ["core", "gtk", "windows", "android/jni", "haiku/capi"]
# The GTK front end builds only where GTK 4 and libadwaita are installed (Linux),
# the Windows one only on Windows (elsewhere it's a stub).
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
